<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>New World Dice Roller</title>
    <style>
        :root {
            --bg: #121016;
            --bg-panel: #1c1926;
            --bg-panel-2: #262230;
            --text: #f1eef7;
            --text-muted: #a89db3;
            --accent: #d9a3ff;
            --accent-strong: #c084f5;
            --accent-contrast: #1a0f24;
            --border: #362f45;
            --success: #7ee787;
            --mixed: #ffd479;
            --failure: #b9aec2;
            --crit-fail: #ff6b81;
            --crit-success: #8affa0;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        .page-header {
            text-align: center;
            padding: 1.5rem 1rem .5rem;
        }

        .page-header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            margin: 0;
        }

        .page-header p {
            color: var(--text-muted);
            margin: .35rem 0 0;
        }

        .app-shell {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            padding: 1rem;
            max-width: 1100px;
            margin: 0 auto;
        }

        @media (min-width: 900px) {
            .app-shell {
                flex-direction: row;
                align-items: stretch;
            }

            .dice-panel {
                flex: 1 1 auto;
                min-width: 0;
            }

            .control-panel {
                flex: 0 0 280px;
            }
        }

        #dice-box-container {
            width: 100%;
            height: clamp(280px, 48vh, 520px);
            position: relative;
            background: radial-gradient(ellipse at center, #241f2e 0%, #0b0a0f 100%);
            border-radius: .75rem;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        #dice-box {
            width: 100%;
            height: 100%;
            position: absolute;
        }

        .result-block {
            text-align: center;
            margin-top: 1rem;
        }

        #roll-val {
            font-size: clamp(2.5rem, 7vw, 4rem);
            font-weight: 900;
            line-height: 1;
        }

        #roll-tier {
            font-weight: bolder;
            letter-spacing: .1rem;
            min-height: 1.5em;
            margin-top: .5rem;
        }

        #roll-list {
            margin-top: .75rem;
            font-size: 1.1rem;
        }

        #roll-list span.kept {
            display: inline-block;
            border: 1px solid var(--accent);
            background: rgba(217, 163, 255, .12);
            border-radius: .4rem;
            padding: .15rem .6rem;
            margin: 0 .2rem;
        }

        #roll-list span.discarded {
            display: inline-block;
            opacity: .4;
            padding: .15rem .4rem;
            margin: 0 .2rem;
        }

        #roll-list .stat-marker {
            color: var(--crit-fail);
            font-weight: bolder;
            text-decoration: underline;
            cursor: default;
        }

        .text-success {
            color: var(--success) !important;
        }

        .text-warning {
            color: var(--mixed) !important;
        }

        .text-secondary {
            color: var(--failure) !important;
        }

        .text-danger {
            color: var(--crit-fail) !important;
        }

        .control-panel {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: .75rem;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 1.1rem;
        }

        .control-group label {
            display: block;
            color: var(--text-muted);
            font-size: .78rem;
            text-transform: uppercase;
            letter-spacing: .06rem;
            margin-bottom: .35rem;
        }

        .control-group select,
        .control-group input[type="number"] {
            width: 100%;
            background: var(--bg-panel-2);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: .5rem;
            padding: .55rem .65rem;
            font-size: 1rem;
        }

        .control-group select:focus,
        .control-group input[type="number"]:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 .2rem rgba(217, 163, 255, .25);
        }

        .adv-stepper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: .75rem;
        }

        .adv-stepper button {
            width: 2.6rem;
            height: 2.6rem;
            flex: none;
            border-radius: 50%;
            border: 1px solid var(--accent);
            background: transparent;
            color: var(--accent);
            font-size: 1.4rem;
            line-height: 1;
            cursor: pointer;
        }

        .adv-stepper button:hover {
            background: rgba(217, 163, 255, .15);
        }

        .adv-stepper button:active {
            background: rgba(217, 163, 255, .3);
        }

        #adv-display {
            flex: 1 1 auto;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
        }

        #adv-hint {
            color: var(--text-muted);
            font-size: .8rem;
            margin-top: .35rem;
            text-align: center;
        }

        #roll-btn {
            width: 100%;
            padding: .8rem;
            border: none;
            border-radius: .5rem;
            background: var(--accent);
            color: var(--accent-contrast);
            font-weight: 800;
            letter-spacing: .15rem;
            font-size: 1.05rem;
            cursor: pointer;
        }

        #roll-btn:hover {
            background: var(--accent-strong);
        }

        #roll-btn:disabled {
            opacity: .6;
            cursor: default;
        }

        .tooltip-inner {
            background: var(--bg-panel-2);
        }
    </style>
    <link rel="stylesheet" href="https://unpkg.com/@3d-dice/dice-box@1.1.4/dist/style.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
</head>

<body>
    <div class="page-header">
        <h1>New World Dice Roller</h1>
        <p>Pick a stat, set your advantage, and roll</p>
    </div>
    <div class="app-shell">
        <div class="dice-panel">
            <div id="dice-box-container">
                <div id="dice-box"></div>
            </div>
            <div class="result-block">
                <div id="roll-val"></div>
                <div id="roll-tier"></div>
                <div id="roll-list"></div>
            </div>
        </div>
        <div class="control-panel">
            <div class="control-group">
                <label for="stat-select">Stat</label>
                <select id="stat-select"></select>
            </div>
            <div class="control-group">
                <label for="stat-value">Value</label>
                <input id="stat-value" type="number" step="1">
            </div>
            <div class="control-group">
                <label>Advantage / Disadvantage</label>
                <div class="adv-stepper">
                    <button type="button" id="adv-minus" aria-label="Decrease advantage">&minus;</button>
                    <div id="adv-display">0</div>
                    <button type="button" id="adv-plus" aria-label="Increase advantage">+</button>
                </div>
                <div id="adv-hint">0 is normal. Positive is advantage, negative is disadvantage.</div>
            </div>
            <button type="button" id="roll-btn">ROLL</button>
        </div>
    </div>
</body>
<script type="module">
    import DiceBox from "https://unpkg.com/@3d-dice/dice-box@1.1.4/dist/dice-box.es.min.js";

    const dieMax = 6;
    const countedDice = 2;
    const stats = [
        { name: 'Endurance', val: 1 },
        { name: 'Strength', val: 1 },
        { name: 'Coordination', val: 1 },
        { name: 'Knowledge', val: 1 },
        { name: 'Cunning', val: 1 },
        { name: 'Instinct', val: 1 },
        { name: 'Resolve', val: 1 },
        { name: 'Diplomacy', val: 1 }
    ];

    const succMin = 10;
    const mixMin = 6;

    const tierFor = (total) => {
        if (total >= succMin) return 'success';
        if (total >= mixMin) return 'mixed';
        return 'failure';
    };

    const tierLabels = {
        'critical-success': 'CRITICAL SUCCESS',
        'success': 'SUCCESS',
        'mixed': 'MIXED SUCCESS',
        'failure': 'FAILURE',
        'critical-failure': 'CRITICAL FAILURE'
    };

    const tierClasses = {
        'critical-success': 'text-success',
        'success': 'text-success',
        'mixed': 'text-warning',
        'failure': 'text-secondary',
        'critical-failure': 'text-danger'
    };

    const advText = (n) => n > 0 ? `+${n} Advantage` : `${n} Disadvantage`;

    // Pure game-logic port of v2's rollDice math: replace the lower of the
    // two kept dice with the stat value if the stat is higher. Advantage
    // rolls more dice and keeps the highest two; disadvantage rolls more
    // and keeps the lowest two. Critical success/failure are based on the
    // two kept dice *before* stat substitution.
    const computeRollResult = (rawDice, advFactor, statVal) => {
        const isAdv = advFactor >= 0;
        let sorted = [...rawDice].sort((a, b) => a - b);
        if (isAdv) sorted.reverse();

        const actualRollSum = sorted.slice(0, countedDice).reduce((a, b) => a + b, 0);
        const isCritFail = actualRollSum === countedDice;
        const isCritSuccess = actualRollSum === countedDice * dieMax;

        let pool, m0, m1, statIndex;
        if (isAdv) {
            pool = [...sorted, statVal];
            pool.sort((a, b) => a - b).reverse();
            statIndex = pool.indexOf(statVal);
            m0 = 0; m1 = 1;
        } else {
            pool = [statVal, ...sorted];
            if (pool[0] >= pool[1]) {
                pool[0] = pool[1];
                pool[1] = statVal;
                statIndex = 1;
            } else {
                statIndex = -1;
            }
            m0 = 1; m1 = 2;
        }

        const total = pool[m0] + pool[m1];
        const tier = isCritFail ? 'critical-failure' : isCritSuccess ? 'critical-success' : tierFor(total);

        return { pool, m0, m1, statIndex, total, tier, isCritFail, isCritSuccess };
    };

    const setCookie = (cname, cvalue, exdays) => {
        const d = new Date();
        d.setTime(d.getTime() + (exdays * 24 * 60 * 60 * 1000));
        let expires = "expires=" + d.toUTCString();
        let cookieString = cname + "=" + cvalue + ";" + expires + ";path=/";
        document.cookie = cookieString;
    };

    const getCookie = (cname) => {
        let name = cname + "=";
        let decodedCookie = decodeURIComponent(document.cookie);
        let ca = decodedCookie.split(';');
        for (let i = 0; i < ca.length; i++) {
            let c = ca[i];
            while (c.charAt(0) == ' ') {
                c = c.substring(1);
            }
            if (c.indexOf(name) == 0) {
                return c.substring(name.length, c.length);
            }
        }
        return "";
    };

    const setStoredStats = (statArray) => {
        let statString = String(statArray.join(","));
        setCookie('storedStats', statString, 365);
    };

    const getStoredStat = (index) => {
        let statString = getCookie('storedStats');
        try {
            let arr = statString.split(",");
            return Number(arr[index]);
        }
        catch (e) {
            return null;
        }
    };

    const loadStoredStatsToStatArray = () => {
        stats.forEach((val, ind) => {
            val.val = getStoredStat(ind) || val.val;
        });
    };

    const renderResult = (stat, advLevel, result) => {
        $("#roll-val").removeClass("text-danger text-success text-warning text-secondary");
        $("#roll-val").addClass(tierClasses[result.tier]);
        $("#roll-val").text(result.isCritFail || result.isCritSuccess ? tierLabels[result.tier] : result.total);

        const advSuffix = advLevel === 0 ? '' : ` w/ ${advText(advLevel)}`;
        $("#roll-tier").removeClass("text-danger text-success text-warning text-secondary");
        $("#roll-tier").addClass(tierClasses[result.tier]);
        $("#roll-tier").text(`${tierLabels[result.tier]} — ${stat.name}${advSuffix}`);

        const pieces = result.pool.map((val, i) => {
            let html = String(val);
            if (i === result.statIndex) {
                html = `<span class='stat-marker'
                    data-bs-toggle='tooltip'
                    id='stat-val-die'
                    title='${stat.name} value'>${html}</span>`;
            }
            const wrapperClass = (i === result.m0 || i === result.m1) ? 'kept' : 'discarded';
            return `<span class='${wrapperClass}'>${html}</span>`;
        });
        $("#roll-list").html(pieces.join(' '));
        var tooltip = document.querySelector("#roll-list #stat-val-die");
        if (tooltip) new bootstrap.Tooltip(tooltip);
    };

    let diceBox;
    let rolling = false;
    let selectedStatIndex = 0;
    let advLevel = 0;

    const setupDiceBox = async () => {
        diceBox = new DiceBox({
            container: "#dice-box",
            assetPath: "assets/",
            origin: "https://unpkg.com/@3d-dice/dice-box@1.1.4/dist/",
            theme: "default",
            themeColor: "#d9a3ff",
            scale: 14,
            gravity: 1,
            settleTimeout: 2500,
            angularDamping: 0.4,
            linearDamping: 0.4
        });
        await diceBox.init();
    };

    const rollDice = async () => {
        if (rolling || !diceBox) return;
        rolling = true;
        $("#roll-btn").prop("disabled", true);
        try {
            const stat = stats[selectedStatIndex];
            const dieCount = countedDice + Math.abs(advLevel);
            const rollResults = await diceBox.roll(`${dieCount}d6`);
            const rawDice = rollResults.map((r) => r.value);
            const result = computeRollResult(rawDice, advLevel, stat.val);
            renderResult(stat, advLevel, result);
        }
        finally {
            rolling = false;
            $("#roll-btn").prop("disabled", false);
        }
    };

    const refreshStatValueInput = () => {
        $("#stat-value").val(stats[selectedStatIndex].val);
    };

    const updateAdvDisplay = () => {
        $("#adv-display").text(advLevel === 0 ? '0' : (advLevel > 0 ? `+${advLevel}` : `${advLevel}`));
    };

    const setup = async () => {
        //get cookie values
        loadStoredStatsToStatArray();

        const $statSelect = $("#stat-select");
        stats.forEach((s, i) => {
            $statSelect.append(`<option value="${i}">${s.name}</option>`);
        });
        $statSelect.on('change', () => {
            selectedStatIndex = Number($statSelect.val());
            refreshStatValueInput();
        });
        refreshStatValueInput();

        $("#stat-value").on('input', function () {
            stats[selectedStatIndex].val = Number($(this).val());
            setStoredStats(stats.map((s) => s.val));
        });

        $("#adv-minus").on('click', () => {
            advLevel -= 1;
            updateAdvDisplay();
        });
        $("#adv-plus").on('click', () => {
            advLevel += 1;
            updateAdvDisplay();
        });

        $("#roll-btn").on('click', rollDice);

        await setupDiceBox();
    };

    $(document).ready(() => {
        setup();
    });
</script>

</html>
